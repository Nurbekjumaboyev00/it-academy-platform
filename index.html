<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Online Academy Platform</title>
</head>
<body>
    <header>
        <h1>Welcome to the IT Online Academy Platform</h1>
    </header>
    <main>
        <section>
            <h2>Enhanced Admin Login</h2>
            <form id="admin-login">
                <label for="admin-user">Username:</label>
                <input type="text" id="admin-user" name="admin-user" required>
                <label for="admin-password">Password:</label>
                <input type="password" id="admin-password" name="admin-password" value="777" required>
                <button type="submit">Login</button>
            </form>
        </section>
        <section>
            <h2>AI Chatbot</h2>
            <div id="chatbot">
                <p>Chatbot is ready to assist you!</p>
            </div>
        </section>
        <section>
            <h2>Telegram Bot Integration</h2>
            <p>Connect with our Telegram bot for real-time updates and support.</p>
        </section>
        <section>
            <h2>Improved Student Login System</h2>
            <form id="student-login">
                <label for="student-email">Email:</label>
                <input type="email" id="student-email" name="student-email" required>
                <label for="student-password">Password:</label>
                <input type="password" id="student-password" name="student-password" required>
                <button type="submit">Login</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 IT Online Academy. All rights reserved.</p>
    </footer>
</body>
</html>
